name: Data or reference correction
description: A rule reference, incident case, threshold citation or scoreboard fact is wrong, outdated or missing its source.
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for keeping this accurate. Please point to the **primary source** (the original author's own page, paper or vendor document), not a third-party summary. Wrong behavior of a rule on your data is a bug report; bad data from your provider goes to the provider.
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: The rule ID, the file in `incidents/` or `scoreboard/`, or the page that holds the wrong fact.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong, and what is correct?
      description: Quote the sentence from the source that supports the correction.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source
      placeholder: "https://…"
    validations:
      required: true
  - type: input
    id: checked
    attributes:
      label: Day you checked it (UTC, YYYY-MM-DD)
    validations:
      required: true
