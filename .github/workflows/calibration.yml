name: Calibration

# Two-source calibration (Yahoo + Alpha Vantage), manual only: one run spends 24 of the free key's 25
# daily Alpha Vantage requests, so it never runs on a schedule, a push or a pull request. Do not run it
# on the same UTC day as the scoreboard, which uses the same key and quota.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: calibration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  two-source:
    name: Two-source calibration
    # Same repository/main/event guard as scripts/check-automation-context.mjs, inline: that script's
    # kinds are tied to activation flags (DOCS_/SCOREBOARD_AUTOMATION_READY) this read-only job does not need.
    if: >-
      github.repository == 'pacocartones/market-data-sanity-checker' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The repository secret ALPHA_VANTAGE_API_KEY (the scoreboard-data environment and its
    # SCOREBOARD_DATA_API_KEY do not exist yet: they belong to the parked scoreboard activation).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Run the two-source calibration
        run: pnpm calibrate --two-source
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          ALPHA_VANTAGE_DAILY_LIMIT: '25'
          ALPHA_VANTAGE_PREMIUM: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calibration-two-source
          path: calibration/two-source.json
          if-no-files-found: error
          retention-days: 30
