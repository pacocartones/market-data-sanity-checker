name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# No permissions at workflow level; each job asks for what it needs.
permissions: {}

jobs:
  # Decides, without any environment or credentials, whether there is anything to
  # release: a pending changeset (→ Version Packages PR) or a package.json version
  # that npm does not have yet (→ publish). When there is nothing, the release job
  # below is skipped before its environment, so no approval is requested for a
  # merge that cannot release anything. When there is something, the release job
  # runs exactly as before and still waits for the required reviewer.
  check:
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: decide
        name: Anything to release?
        run: |
          changesets=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then published=yes; else published=no; fi
          echo "pending changesets: $changesets; $name@$version on npm: $published"
          if [ "$changesets" -gt 0 ] || [ "$published" = no ]; then needed=true; else needed=false; fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "release needed: $needed"

  release:
    needs: check
    # Publishes to npm only when explicitly enabled: configure this repository
    # and workflow as a trusted publisher of the package on npmjs.com, THEN set
    # the repository variable NPM_PUBLISH_ENABLED=true (Settings → Secrets and
    # variables → Actions → Variables). Until then the workflow skips cleanly
    # instead of failing on every push. No npm token is stored anywhere.
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && needs.check.outputs.needed == 'true' }}
    # Human gate before publishing: the job pauses until a required reviewer
    # approves it in the Actions UI (Environment "release", reviewer
    # pacocartones). The trusted publisher on npmjs.com names this environment
    # too, so a run outside it cannot publish.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "Version Packages" commit, create and edit GitHub releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: npm trusted publishing and the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changesets/action v2 pushes the Version Packages commit and tags
          # through the GitHub API with its github-token input, so the checkout
          # no longer needs to leave credentials in the git config.
          persist-credentials: false
          # Full history, so changesets can diff against the base branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ships npm 11, which npm documents for trusted publishing.
          # pnpm 11 does the OIDC token exchange itself (pnpm CHANGELOG 11.0.7;
          # it calls the registry's /-/npm/v1/oidc/token/exchange endpoint),
          # so this is belt and braces rather than a hard requirement.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build dist/ upfront: publishing happens inside the changesets step below.
      - run: pnpm build
      - name: Create Version Packages PR or publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # v2 renamed the inputs (version -> version-script, publish ->
          # publish-script); the old names are silently ignored.
          version-script: pnpm changeset version
          # `changeset publish` has no --provenance flag (verified against
          # @changesets/cli 3.0.3); it shells out to `pnpm publish`, which
          # enables provenance via the PNPM_CONFIG_PROVENANCE env var below.
          # pnpm 11 reads PNPM_CONFIG_* env vars and IGNORES NPM_CONFIG_* —
          # verified locally: PNPM_CONFIG_PROVENANCE=true surfaces in
          # `pnpm config get provenance`, NPM_CONFIG_PROVENANCE does not.
          publish-script: pnpm changeset publish
        env:
          # No NPM_TOKEN: authentication is npm trusted publishing (OIDC).
          # changesets/action v2 no longer writes an .npmrc from NPM_TOKEN
          # anyway (its CHANGELOG, #695), and pnpm 11 prefers OIDC over any
          # static token when both exist.
          PNPM_CONFIG_PROVENANCE: "true"
          # @changesets/changelog-github reads pull request and author data from the API.
          GITHUB_TOKEN: ${{ github.token }}
      # Rewrite the GitHub release changesets just created in the house format
      # (RELEASING.md): title "vX.Y.Z — summary" and the fixed sections.
      - name: Release notes in the house format
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # changesets/action v2 names this output published-packages (v1: publishedPackages).
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=$(jq -r '.[0].version // empty' <<<"$PUBLISHED")
          [ -n "$version" ] || { echo "::error::no published version in the changesets output"; exit 1; }
          pnpm -s release-notes build "$version" > notes.json
          jq -r .body notes.json > notes.md
          gh release edit "v$version" --title "$(jq -r .title notes.json)" --notes-file notes.md
