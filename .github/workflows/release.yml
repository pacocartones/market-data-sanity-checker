name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the "Version Packages" commit and create GitHub releases
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # OIDC token required for npm provenance attestation

jobs:
  release:
    # Publishes to npm only when explicitly enabled: create the NPM_TOKEN secret
    # AND set the repository variable NPM_PUBLISH_ENABLED=true (Settings →
    # Secrets and variables → Actions → Variables). Until then the workflow
    # skips cleanly instead of failing on every push.
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    # Human gate before publishing: the job pauses until a required reviewer
    # approves it in the Actions UI (Environment "release", reviewer
    # pacocartones). Create NPM_TOKEN as an ENVIRONMENT secret scoped to
    # "release" — a repo-level secret would bypass the environment scoping.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Explicitly persisted: changesets/action pushes the Version Packages
          # commit through these credentials. (artipacked flags only implicit
          # persistence; this is a deliberate, documented decision.)
          persist-credentials: true
          # Full history, so changesets can diff against the base branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build dist/ upfront: publishing happens inside the changesets step below.
      - run: pnpm build
      - name: Create Version Packages PR or publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          # `changeset publish` has no --provenance flag (verified against
          # @changesets/cli 2.31.1); it shells out to `pnpm publish`, which
          # enables provenance via the PNPM_CONFIG_PROVENANCE env var below.
          # pnpm 11 reads PNPM_CONFIG_* env vars and IGNORES NPM_CONFIG_* —
          # verified locally: PNPM_CONFIG_PROVENANCE=true surfaces in
          # `pnpm config get provenance`, NPM_CONFIG_PROVENANCE does not.
          publish: pnpm changeset publish
        env:
          # npm access token (automation or granular, publish scope, no 2FA on
          # publish). Create one at https://www.npmjs.com/settings/<you>/tokens
          # and store it as the NPM_TOKEN ENVIRONMENT secret scoped to the
          # "release" environment (Settings → Environments → release), so the
          # token is only reachable through the human-approval gate.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_PROVENANCE: "true"
