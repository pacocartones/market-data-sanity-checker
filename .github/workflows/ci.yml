name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel redundant runs on rapid pushes to the same branch/PR. event_name
# keeps scheduled runs (none here today) from being cancelled by pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # pnpm 11 (our toolchain) requires Node >= 22.13; the package itself runs on 20+
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # informational until thresholds are tuned
      - run: pnpm test:coverage
        continue-on-error: true
      - run: pnpm build
