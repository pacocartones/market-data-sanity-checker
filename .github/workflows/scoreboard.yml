name: Scoreboard

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# One writer for manual and scheduled runs; never cancel a publication midway.
concurrency:
  group: scoreboard-${{ github.repository }}
  cancel-in-progress: false

env:
  SCOREBOARD_AUTOMATION_READY: ${{ vars.SCOREBOARD_AUTOMATION_READY }}
  SCOREBOARD_APP_CLIENT_ID: ${{ vars.SCOREBOARD_APP_CLIENT_ID }}

jobs:
  context:
    if: github.repository == 'pacocartones/market-data-sanity-checker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: context
        run: node scripts/check-automation-context.mjs scoreboard --check-main
        env:
          GH_TOKEN: ${{ github.token }}

  produce:
    needs: context
    if: github.repository == 'pacocartones/market-data-sanity-checker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: scoreboard-data
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      payload-sha256: ${{ steps.pack.outputs.payload-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the environment-scoped data credential
        run: test -n "$DATA_KEY" || { echo "Scoreboard data configuration is pending."; exit 1; }
        env:
          DATA_KEY: ${{ secrets.SCOREBOARD_DATA_API_KEY }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
        # Keep dependencies and application code out of the publication job.
      - run: pnpm install --frozen-lockfile
      - name: Run the scoreboard
        run: pnpm scoreboard
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.SCOREBOARD_DATA_API_KEY }}
          ALPHA_VANTAGE_DAILY_LIMIT: '25'
          ALPHA_VANTAGE_PREMIUM: 'false'
      - name: Validate and pack data
        id: pack
        run: node --experimental-strip-types scripts/scoreboard-artifact.mjs pack scoreboard "$RUNNER_TEMP/scoreboard-upload"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          path: ${{ runner.temp }}/scoreboard-upload/scoreboard-${{ github.run_id }}-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          retention-days: 3

  deliver:
    needs: [context, produce]
    if: github.repository == 'pacocartones/market-data-sanity-checker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: scoreboard-delivery
    permissions:
      contents: read
      actions: read
    env:
      SCOREBOARD_ARTIFACT_ID: ${{ needs.produce.outputs.artifact-id }}
      SCOREBOARD_PAYLOAD_SHA256: ${{ needs.produce.outputs.payload-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check source and artifact metadata before downloading
        run: |
          node scripts/check-automation-context.mjs scoreboard --check-main
          node --experimental-strip-types scripts/scoreboard-artifact.mjs check-artifact
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.produce.outputs.artifact-id }}
          path: ${{ runner.temp }}/scoreboard-download
          skip-decompress: true
          digest-mismatch: error
      - name: Validate data before obtaining publication credentials
        run: node --experimental-strip-types scripts/scoreboard-artifact.mjs validate "$RUNNER_TEMP/scoreboard-download"
      - name: Require the environment-scoped App credential
        run: test -n "$APP_KEY" || { echo "Scoreboard delivery configuration is pending."; exit 1; }
        env:
          APP_KEY: ${{ secrets.SCOREBOARD_DELIVERY_APP_KEY }}
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.SCOREBOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCOREBOARD_DELIVERY_APP_KEY }}
          owner: pacocartones
          repositories: market-data-sanity-checker
          permission-contents: write
          permission-pull-requests: write
      - name: Publish the data-only branch and pull request
        run: node --experimental-strip-types scripts/publish-scoreboard.mjs "$RUNNER_TEMP/scoreboard-download"
        env:
          SCOREBOARD_APP_TOKEN: ${{ steps.app.outputs.token }}
          SCOREBOARD_APP_SLUG: ${{ steps.app.outputs.app-slug }}
