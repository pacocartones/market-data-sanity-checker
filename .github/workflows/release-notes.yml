name: Release notes

# Checks that every published or edited release follows RELEASING.md: a
# "vX.Y.Z — summary" title, a summary paragraph, a Verify section, a
# Contributors section when someone is thanked, and no AI attribution.
# Read-only: it reads the release and fails the run when the format is broken.
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check (for example v1.5.2)
        required: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache: this workflow runs on release events, and a
          # cache written by another workflow must not reach it (zizmor cache-poisoning).
          # setup-node caches by default when package.json declares packageManager.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$TAG" --json name,body > release.json
          jq -r .body release.json > notes.md
          pnpm -s release-notes check notes.md --title "$(jq -r .name release.json)"
