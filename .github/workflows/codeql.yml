name: CodeQL

# Thin caller: the logic lives in pacocartones/.github (docs: its README, "codeql").
# Pinned by full commit SHA; take a newer one in a pull request so CI runs on it:
#   git ls-remote https://github.com/pacocartones/.github refs/heads/main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 06:41 UTC (off the hour mark, on purpose)
    - cron: '41 6 * * 1'
  workflow_dispatch: {}

# Cancel redundant runs on rapid pushes; event_name keeps the scheduled
# Monday run from being cancelled by a concurrent push (and vice versa).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    # Code scanning needs GitHub Advanced Security, unavailable on private repos
    # on the free plan — the job activates itself when the repo goes public.
    if: ${{ github.event.repository.visibility == 'public' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: pacocartones/.github/.github/workflows/codeql.yml@df9998c0cce73d34b42a10062a803240b6937f9b # main 2026-11-26
    with:
      language: javascript-typescript
