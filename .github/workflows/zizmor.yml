name: zizmor

on:
  push:
    branches: [main]
  pull_request:

# Cancel redundant runs on rapid pushes to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      # Checkout needs read access while the repo is private.
      contents: read
      # Upload findings to the Security tab (SARIF / code scanning).
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Explicitly persisted: checkout needs the token to fetch at all while
          # the repo is private. Flip to false when the repo goes public.
          persist-credentials: true
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          # Pin the audit version: the action's default is "latest", which
          # silently follows the action's own releases — a new zizmor can
          # break CI without notice. 1.28.0 is the version verified against
          # this repo; bump it deliberately when upgrading.
          version: 1.28.0
          # SARIF upload needs GitHub Advanced Security, unavailable on private
          # repos on the free plan — findings surface as workflow annotations
          # instead. Flip to true when the repo goes public.
          advanced-security: false
