name: zizmor

on:
  push:
    branches: [main]
  pull_request:

# Cancel redundant runs on rapid pushes to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      # Checkout needs read access while the repo is private.
      contents: read
      # Upload findings to the Security tab (SARIF / code scanning).
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Pin the audit version: the action's default is "latest", which
          # silently follows the action's own releases — a new zizmor can
          # break CI without notice. 1.28.0 is the version verified against
          # this repo; bump it deliberately when upgrading.
          version: 1.28.0
          advanced-security: true
