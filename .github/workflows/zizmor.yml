name: zizmor

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      # Checkout needs read access while the repo is private.
      contents: read
      # Upload findings to the Security tab (SARIF / code scanning).
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Explicitly persisted: checkout needs the token to fetch at all while
          # the repo is private. Flip to false when the repo goes public.
          persist-credentials: true
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          # SARIF upload needs GitHub Advanced Security, unavailable on private
          # repos on the free plan — findings surface as workflow annotations
          # instead. Flip to true when the repo goes public.
          advanced-security: false
